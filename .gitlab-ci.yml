image: ocaml/opam:debian-12-opam

stages:
  - build
  - test
  - release

build:
  stage: build

  script:
    - |
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -y
      apt-get install -y --no-install-recommends pkg-config build-essential m4
      if [ -d _opam ]; then
        echo "Reusing previous _opam directory, nothing to do."
      fi

      if [ ! -d _opam ]; then
        echo "No _opam directory found, creating opam switch"
        opam switch create --yes --no-install . 5.3.0
      fi

      eval $(opam env)
      opam update
      opam install . --deps-only --with-test --with-doc --yes
      opam exec -- dune build @all

  cache:
    key:
      files:
        - metrocaml.opam
    paths:
      - _opam

  artifacts:
    name: "$CI_JOB_NAME"
    when: on_success
    paths:
      - _build

test:
  stage: test
  
  dependencies:
    - build
  
  script:
    - eval $(opam env)
    - opam exec -- dune test --instrument-with bisect_ppx -f
    - opam exec -- bisect-ppx-report summary
    - opam exec -- bisect-ppx-report cobertura _coverage/cobertura-coverage.xml

  coverage: '/Coverage: \d+\/\d+ \((\d+\.\d+%)\)/'

  cache:
    key:
      files:
        - metrocaml.opam
    paths:
      - _opam

  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: _coverage/cobertura-coverage.xml

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      release-cli create \
        --name "Release v${VERSION}" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(cat CHANGELOG.md)"