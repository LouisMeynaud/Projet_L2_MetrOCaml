image: ocaml/opam:debian-ocaml-5.4

stages:
  - setup
  - build

setup:
  stage: setup

  script:
    - if [ -d _opam ]; then echo "Reusing previous _opam directory, nothing to do."; fi
    - >
      if [ ! -d _opam ]; then
        echo "No _opam directory found, creating opam switch"
        opam switch create --yes --no-install . 5.4.0

        eval $(opam env)
        opam update
        opam install . --deps-only --with-test --with-doc --yes
      fi
    
  cache:
    key:
      files:
        - metrocaml.opam
    paths:
      - _opam

build:
  stage: build

  script:
    - eval $(opam env)
    - dune build @all

  cache:
    key:
      files:
        - metrocaml.opam
    paths:
      - _opam

  artifacts:
    name: "$CI_JOB_NAME"
    when: on_success
    paths:
      - _build
