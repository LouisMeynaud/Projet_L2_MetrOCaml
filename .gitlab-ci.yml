image: ocaml/opam:debian-12

stages:
  - setup
  - lint
  - test
  - release
  - docs
#  - deploy

# --- Cache template ---
.opam_cache: &opam_cache
  cache:
    key:
      files:
        - metrocaml.opam
    paths:
      - _opam

# --- Setup ---
setup:
  stage: setup
  <<: *opam_cache
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - sudo -E apt-get update -qq
    - sudo -E apt-get install -y -qq libgmp-dev pkg-config
    - opam switch create --yes --no-install . 5.3.0 2>/dev/null || true
    - opam update
    - eval $(opam env --switch=. --set-switch)
    - opam install . --deps-only --with-test --with-doc --yes

# --- Lint ---
lint:
  stage: lint
  <<: *opam_cache
  script:
    - eval $(opam env --switch=. --set-switch)
    - opam exec -- dune build @fmt

# --- Test ---
test:
  stage: test
  <<: *opam_cache
  script:
    - eval $(opam env --switch=. --set-switch)
    - opam exec -- dune test --instrument-with bisect_ppx -f
    - opam exec -- bisect-ppx-report summary
    - opam exec -- bisect-ppx-report html -o _coverage/html
    - opam exec -- bisect-ppx-report cobertura _coverage/cobertura-coverage.xml
  coverage: '/Coverage: \d+\/\d+ \((\d+\.\d+%)\)/'
  artifacts:
    paths:
      - _build
      - _coverage/html
    reports:
      coverage_report:
        coverage_format: cobertura
        path: _coverage/cobertura-coverage.xml

# --- Release ---
upload_binaries:
  stage: release
  <<: *opam_cache
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - sudo -E apt-get update -qq
    - sudo -E apt-get install -y -qq libgmp-dev pkg-config
    - eval $(opam env --switch=. --set-switch)
    - opam install bogue graphics tsdl-ttf --yes
    - opam exec -- dune build
    - VERSION="${CI_COMMIT_TAG#v}"
    - cp _build/default/metrocaml/bin/main.exe metrocaml
    - cp _build/default/tiktocaml/main.exe tiktocaml
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file metrocaml \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/metrocaml/${VERSION}/metrocaml"
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file tiktocaml \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/metrocaml/${VERSION}/tiktocaml"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["upload_binaries"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - METROCAML_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/metrocaml/${VERSION}/metrocaml"
    - TIKTOCAML_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/metrocaml/${VERSION}/tiktocaml"
    - |
      release-cli create \
        --name "Release v${VERSION}" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(cat CHANGELOG.md)" \
        --assets-link "{\"name\":\"metrocaml\",\"url\":\"${METROCAML_URL}\"}" \
        --assets-link "{\"name\":\"tiktocaml\",\"url\":\"${TIKTOCAML_URL}\"}"

# --- Docs ---
docs:
  stage: docs
  <<: *opam_cache
  dependencies:
    - test
  script:
    - eval $(opam env --switch=. --set-switch)
    - opam exec -- dune build @doc
    - mkdir -p public
    - cp -r _build/default/_doc/_html public/docs
    - cp -r _coverage/html public/coverage
  artifacts:
    paths:
      - public

