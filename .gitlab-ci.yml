image: ocaml/opam:ubuntu-22.04

stages:
  - setup
  - lint
  - test
  - release
  - docs
#  - deploy

# --- Cache template ---
.opam_cache: &opam_cache
  cache:
    key:
      files:
        - metrocaml.opam
    paths:
      - _opam

# --- Setup ---
setup:
  stage: setup
  <<: *opam_cache
  script:
    - opam switch create --yes --no-install . 5.3.0 || true
    - opam update
    - eval $(opam env)
    - opam install . --deps-only --with-test --with-doc --yes

# --- Lint ---
lint:
  stage: lint
  <<: *opam_cache
  script:
    - opam exec -- dune build @fmt

# --- Test ---
test:
  stage: test
  <<: *opam_cache
  script:
    - opam exec -- dune test --instrument-with bisect_ppx -f
    - opam exec -- bisect-ppx-report summary
    - opam exec -- bisect-ppx-report html -o _coverage/html
    - opam exec -- bisect-ppx-report cobertura _coverage/cobertura-coverage.xml
  coverage: '/Coverage: \d+\/\d+ \((\d+\.\d+%)\)/'
  artifacts:
    paths:
      - _build
      - _coverage/html
    reports:
      coverage_report:
        coverage_format: cobertura
        path: _coverage/cobertura-coverage.xml

# --- Release ---
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      release-cli create \
        --name "Release v${VERSION}" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(cat CHANGELOG.md)"

# --- Docs ---
docs:
  stage: docs
  <<: *opam_cache
  dependencies:
    - test
  script:
    - opam exec -- dune build @doc
    - mkdir -p public
    - cp -r _build/default/_doc/_html public/docs
    - cp -r _coverage/html public/coverage
  artifacts:
    paths:
      - public

